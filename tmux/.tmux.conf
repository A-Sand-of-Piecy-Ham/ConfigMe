# List of plugins.
#
# Only tpm, sensible, sidebar, resurrect and continuum actually live in the
# tmux-plugins org. The other four were listed under it and tpm 404'd on every
# one; they are third-party and keep their own owners.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'b0o/tmux-autoreload'
set -g @plugin 'thepante/tmux-git-autofetch'
set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @plugin 'noscript/tmux-mighty-scroll'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'

set -g mouse on

# Run panes as non-login shells. macOS tmux defaults to login shells, which
# source only .bash_profile and skip .bashrc, where bash-completion (and git's
# tab-complete) is set up. Linux already behaves this way, so this is a no-op
# there — it is set unconditionally to keep pane startup identical on both.
set -g default-command "${SHELL}"

# Vi mode
set -g mode-keys vi
set -g status-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

# Required by nvim's image.nvim, which draws images using the terminal's Kitty
# graphics protocol. tmux normally strips the escape sequences that carry them.
#
# allow-passthrough lets an application emit those sequences through tmux
# untouched. visual-activity must be off because the image data trips tmux's
# activity detection and it would spam the status line. focus-events lets nvim
# learn when its pane loses focus, which it needs in order to clear images that
# would otherwise be left painted over whatever is drawn next.
set -gq allow-passthrough on
set -g visual-activity off
set-option -g focus-events on

# Refresh terminal-identifying variables on attach. A tmux server keeps the
# environment of whatever terminal first started it, so attaching from kitty to
# a server originally started under WezTerm leaves TERM_PROGRAM=WezTerm in
# every new pane.
set -ga update-environment "TERM_PROGRAM TERM_PROGRAM_VERSION KITTY_WINDOW_ID KITTY_PID COLORTERM"

# Truecolor passthrough for kitty, so nvim colourschemes are not quantised to
# 256 colours. tmux only advertises RGB for terminals it knows support it.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
set -as terminal-features ",xterm-256color:RGB"

# Reload binding. ~/.tmux.conf is a symlink into the dotfiles repo, and a
# running server never re-reads its config on its own -- editing the repo file
# has no effect on existing sessions until this runs. tmux-autoreload would
# cover it, but it watches the symlink rather than its target.
bind R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ------------------------------------------------------------ behaviour ------
# tmux waits this long after an Escape to see whether more bytes follow, making
# it part of an escape sequence. The 500ms default puts half a second of lag on
# every mode change in nvim, which reads as the editor being sluggish. 10ms is
# still ample for a real sequence arriving over a local pty.
set -sg escape-time 10

# 2000 lines of scrollback is very little once a build or a test run scrolls
# past.
set -g history-limit 50000

# `external` sounds permissive but means the opposite: tmux sets the terminal
# clipboard itself while IGNORING OSC 52 from applications inside it, so nvim's
# "+y never reaches the Windows clipboard. `on` accepts them.
set -g set-clipboard on

# Without this, a window shared by two clients is constrained to the smaller
# one even when only the larger is looking at it.
setw -g aggressive-resize on

# Windows and panes numbered from 1, matching the number-key row. renumber
# closes the gaps left when a middle window is killed.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --------------------------------------------------------------- prefix ------
# C-Space instead of C-b, which collides with vim's page-up -- felt both in
# nvim and in tmux's own vi copy-mode. send-prefix passes it through to a
# nested tmux.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ------------------------------------------------------------- movement ------
# vi-style pane navigation. -r allows repeating without re-pressing the prefix.
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# `l` was last-window by default; moved rather than lost. Not to Tab: tpm runs
# at the bottom of this file, so plugin bindings are applied last and win, and
# tmux-sidebar claims both Tab and BSpace.
bind a last-window

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Splits and new windows inherit the current directory. tmux otherwise starts
# them in whatever directory the session was created in, which is almost never
# what is wanted.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ---------------------------------------------------------------- misc -------
# The 750ms default is too short to actually read a message before it clears.
set -g display-time 2000
set -g repeat-time 400

# Report the session and window to the outer terminal, so kitty's window and
# tab titles track tmux instead of showing a bare shell name.
set -g set-titles on
set -g set-titles-string "#{session_name} · #{window_name}"

# Closing the last window of a session switches to another session rather than
# dropping the client back to the shell.
set -g detach-on-destroy off

# automatic-rename still names a window after the running command, but programs
# can no longer override the name with an escape sequence, which otherwise
# leaves windows stuck with whatever a stray sequence last set.
set -g allow-rename off

# Escape leaves copy-mode. Without this only q and C-c do, and Escape is the
# reflex coming from vim.
bind -T copy-mode-vi Escape send -X cancel

# Session switcher through fzf, which is nicer to scan than choose-tree at more
# than a handful of sessions. choose-tree stays on S.
bind s display-popup -E -w 60% -h 60% "tmux list-sessions -F '#{session_name}' | fzf --reverse --prompt='session > ' | xargs -r tmux switch-client -t"
bind S choose-tree -Zs

# Scratch shell in a popup, sharing the current pane's directory. Closing the
# shell closes the popup.
bind C-p display-popup -E -d "#{pane_current_path}" -w 80% -h 80% "$SHELL"

set -g @continuum-save-interval '15'

# -------------------------------------------------------------- status -------
# Colours are astrodark, matching the nvim colourscheme in
# nvim/lua/plugins/astroui.lua.
#
# Deliberately no #(shell) substitutions anywhere in these formats: they would
# fork a process on every status refresh. Everything here is a built-in format
# variable, which costs nothing.
set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#111317,fg=#ADB0BB"
set -g status-left-length 40
set -g status-right-length 90

set -g status-left "#[bg=#50A4E9,fg=#111317,bold]  #S #[bg=#111317,fg=#50A4E9,nobold]#[default] "

set -g window-status-format "#[fg=#696C76]#I #W#{?window_zoomed_flag, ,}  "
set -g window-status-current-format "#[fg=#5EB7FF,bold]#I #W#{?window_zoomed_flag, ,}  "
set -g window-status-separator ""

# The PREFIX block only appears while the prefix is held, which removes the
# "did that keystroke register?" pause. Commas inside the conditional are
# escaped as #, since tmux uses them as argument separators.
set -g status-right "#{?client_prefix,#[bg=#D09214#,fg=#111317#,bold] PREFIX #[default] ,}#[fg=#696C76]󰒋 #[fg=#ADB0BB]#h #[fg=#696C76]│ #[fg=#ADB0BB] %H:%M "

setw -g window-status-activity-style "fg=#EB8332"
set -g message-style "bg=#D09214,fg=#111317,bold"
set -g mode-style "bg=#50A4E9,fg=#111317"
set -g pane-border-style "fg=#2A2E37"
set -g pane-active-border-style "fg=#50A4E9"

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
