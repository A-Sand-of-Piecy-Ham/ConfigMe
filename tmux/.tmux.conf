# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'tmux-plugins/tmux-autoreload'
set -g @plugin 'tmux-plugins/tmux-git-autofetch'
set -g @plugin 'tmux-plugins/tmux-menus'
set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @plugin 'tmux-plugins/tmux-mighty-scroll'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'

set -g mouse on

# Run panes as non-login shells. macOS tmux defaults to login shells, which
# source only .bash_profile — skipping .bashrc, where bash-completion (and
# git's tab-complete) is set up.
set -g default-command "${SHELL}"

# Vi mode
set -g mode-keys vi
set -g status-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle
set -g @continuum-restore 'on'

# Required by nvim's image.nvim, which draws images using the terminal's Kitty
# graphics protocol. tmux normally strips the escape sequences that carry them.
#
# allow-passthrough lets an application emit those sequences through tmux
# untouched. visual-activity must be off because the image data trips tmux's
# activity detection and it would spam the status line. focus-events lets nvim
# learn when its pane loses focus, which it needs in order to clear images that
# would otherwise be left painted over whatever is drawn next.
set -gq allow-passthrough on
set -g visual-activity off
set-option -g focus-events on

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
