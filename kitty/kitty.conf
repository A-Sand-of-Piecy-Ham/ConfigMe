# Kitty, run as a WSLg GUI application.
#
# Kitty is the reference implementation of the terminal graphics protocol, and
# unlike WezTerm it supports unicode placeholders -- which is what lets nvim
# (snacks.image) place images as real text cells so they scroll, clip, and
# redraw correctly. WezTerm remains installed on the Windows side for Git Bash
# and PowerShell; see wezterm/wezterm.lua.

# ---------------------------------------------------------------- shell ------
# Boot straight into tmux, mirroring the Ghostty and WezTerm setups. Plain
# `new-session` (no -A, no name) so each window gets its own session rather
# than every window mirroring one shared session.
shell bash -l -c "exec tmux new-session"

# ---------------------------------------------------------------- font -------
# JetBrainsMono Nerd Font carries the glyphs AstroNvim's statusline and file
# tree rely on. Installed per-user under ~/.local/share/fonts, so no root.
font_family      JetBrainsMono NF
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# WSLg reports a generic DPI, so kitty's automatic thin-stroke adjustment
# guesses badly and text reads muddy. A small positive gamma restores weight.
text_composition_strategy 1.0 0

# --------------------------------------------------------- performance -------
# Under WSLg the compositor is on the Windows side, so waiting on its vblank
# adds a frame of latency for no tearing benefit that we can observe.
sync_to_monitor no

# Defaults are 10ms/3ms. Lowering the repaint delay costs GPU time that is
# cheap now that d3d12 is doing the work, and makes scrolling in nvim feel
# noticeably tighter over the WSLg hop.
repaint_delay 8
input_delay 2

# Kitty keeps a scrollback buffer in memory; the pager offloads the bulk of it
# to a temp file instead. 10k lines is plenty with tmux also scrolling back.
scrollback_lines 10000

# ------------------------------------------------------------- graphics ------
# Images can be large; give the protocol room rather than having nvim's image
# transfers rejected on a busy buffer.
clipboard_control write-clipboard write-primary read-clipboard read-primary

# ---------------------------------------------------------------- misc -------
# tmux owns tabs and splits, so kitty's own are redundant and only add another
# set of keybindings to remember.
enabled_layouts tall
confirm_os_window_close 0

# WSLg has no xdg-desktop-portal or notification daemon, so kitty's desktop
# integration attempts log errors on every start. Turn them off.
notify_on_cmd_finish never

cursor_blink_interval 0
window_padding_width 4
