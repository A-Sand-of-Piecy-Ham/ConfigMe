# Kitty, run as a WSLg GUI application.
#
# Kitty is the reference implementation of the terminal graphics protocol, and
# unlike WezTerm it supports unicode placeholders -- which is what lets nvim
# (snacks.image) place images as real text cells so they scroll, clip, and
# redraw correctly. WezTerm remains installed on the Windows side for Git Bash
# and PowerShell; see wezterm/wezterm.lua.

# ---------------------------------------------------------------- shell ------
# Boot straight into tmux, mirroring the Ghostty and WezTerm setups. Plain
# `new-session` (no -A, no name) so each window gets its own session rather
# than every window mirroring one shared session.
shell bash -l -c "exec tmux new-session"

# ---------------------------------------------------------------- font -------
# JetBrainsMono Nerd Font carries the glyphs AstroNvim's statusline and file
# tree rely on. Installed per-user under ~/.local/share/fonts, so no root.
font_family      JetBrainsMono NF
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# WSLg reports a generic DPI, so kitty's automatic thin-stroke adjustment
# guesses badly and text reads muddy. A small positive gamma restores weight.
text_composition_strategy 1.0 0

# --------------------------------------------------------- performance -------
# Under WSLg the compositor is on the Windows side, so waiting on its vblank
# adds a frame of latency for no tearing benefit that we can observe.
sync_to_monitor no

# Defaults are 10ms/3ms. Lowering the repaint delay costs GPU time that is
# cheap now that d3d12 is doing the work, and makes scrolling in nvim feel
# noticeably tighter over the WSLg hop.
repaint_delay 8
input_delay 2

# Kitty keeps a scrollback buffer in memory; the pager offloads the bulk of it
# to a temp file instead. 10k lines is plenty with tmux also scrolling back.
scrollback_lines 10000

# ------------------------------------------------------------- graphics ------
# Images can be large; give the protocol room rather than having nvim's image
# transfers rejected on a busy buffer.
clipboard_control write-clipboard write-primary read-clipboard read-primary

# ---------------------------------------------------------------- misc -------
# tmux owns tabs and splits, so kitty's own are redundant and only add another
# set of keybindings to remember.
enabled_layouts tall
confirm_os_window_close 0

cursor_blink_interval 0
window_padding_width 4

# -------------------------------------------------------------- kittens -----
# Kittens are kitty's built-in subprograms. These bindings extend the defaults,
# which already provide ctrl+shift+p>f (insert a path) and ctrl+shift+u
# (unicode input).
#
# Everything below is keyboard-driven selection from what is already on screen:
# press the binding, every match gets a letter, type the letter.

# kitty's default for opening a URL is ctrl+shift+e, but TickTick registers
# that as a Windows global hotkey. A global hotkey is intercepted by the OS
# before the focused application sees it, so kitty could never receive this
# combination -- the binding would look present and silently never fire.
# Opening a URL moves into the ctrl+shift+p family with everything else.
map ctrl+shift+e no_op
map ctrl+shift+p>o open_url_with_hints

# Open a file:line from compiler or test output in nvim. `background` rather
# than `self` or `tab` because the editor command is kitty-nvim, which routes
# into the running tmux session -- see the editor setting in the local include.
map ctrl+shift+p>n kitten hints --type linenum --linenum-action background

# Copy rather than insert: paths, git hashes, and whole lines.
map ctrl+shift+p>y kitten hints --type path --program @copy
map ctrl+shift+p>h kitten hints --type hash --program @copy
map ctrl+shift+p>l kitten hints --type line --program @copy
map ctrl+shift+p>w kitten hints --type word --program @copy

# Copy a URL rather than opening it.
map ctrl+shift+p>u kitten hints --type url --program @copy

# --------------------------------------------------------- remote control ---
# `socket-only` rather than `yes`: with `yes`, any program that can write to
# the terminal -- including something scrolling past in a log -- can drive
# kitty. Restricting to the socket means only processes that can open it can.
allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}

# ------------------------------------------------------- notifications -------
# Nothing is set here on purpose. `notify_on_cmd_finish` defaults to `never`
# already, and how a notification should be delivered is machine-specific:
# under WSL it goes to a Windows toast, on a Linux desktop to the local daemon.
# That belongs in the machine-local include below, not in shared config.

# ------------------------------------------------------ local overrides ------
# Machine-specific settings, generated by install.sh and deliberately NOT in
# the repo. The pattern must be relative: kitty rejects an absolute one with
# "Non-relative patterns are unsupported". It resolves against the directory of
# the config file as opened -- ~/.config/kitty -- rather than following this
# file's symlink into the repo, which is what makes the split work.
globinclude local/*.conf
