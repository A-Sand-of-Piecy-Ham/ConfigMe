# The milestones, what each one needs, and how each is checked. Read by
# scripts/check. What each milestone asks for is in <milestone doc>.
#
# needs   the ids that must be done (and merged into the default branch)
#         before this one can start. Milestones whose needs are all done can
#         be worked at the same time, so write what a milestone really uses,
#         not what happens to sit above it: the first frame's list was a
#         sequence, and three of its small milestones turned out to need
#         nothing after the first checkpoint. Two milestones that edit the
#         same file need one another even when the code does not. Name only
#         the direct ones. Left out, it means the entry above.
# tier    who does it: T1 reviewer, T2 implementer, T3 small implementer.
#         Which model each tier is today is not recorded here; your session's
#         instructions say which tier you are. If they do not, ask the user.
# effort  the reasoning effort to start from. A suggestion; the user sets it.
# status  "" not started, "done", or "held" (finished except for a disputed
#         test; what needs it may still start). Implementers set their own
#         milestone's; nothing else here.
# first_playable  on one checkpoint: the first point where it runs without
#         crashing and someone other than the builder can try it. Not the
#         finished version.

[check]
log = "docs/log.jsonl"
# main_branch = "main"    # set when the default branch has another name
# Must exit non-zero on any warning. Leave out to skip the lint gate.
lint = "<lint command>"
# Must exit non-zero when a file is not formatted, and change nothing.
# format_fix is the line shown to the implementer when it fails. Leave both
# out to skip the format gate.
format = "<format check command>"
format_fix = "Not formatted. Run: <format command>"
# Regex for a stub left for a milestone. {tag} is the milestone's stub_tag,
# else its id. Make it unable to match M1 inside M10.
stub = '<stub marker with {tag}>'
stub_paths = ["<source dir>"]
stub_glob = "*.<ext>"
stub_exclude = '<regex for paths to skip, e.g. test dirs>'
# How the test runner's output names a failed test (group 1 = the name the
# implementer writes in a dispute row), counts passes, and reports errors.
failed_test = '<regex>'
passed = '(\d+) passed'
detail = '<regex for lines worth showing on failure>'

# Filled-in [check] tables. Rust:
#   lint = "cargo clippy -q --all-targets -- -D warnings"
#   format = "cargo fmt --check"      format_fix = "Not formatted. Run: cargo fmt"
#   stub = 'todo!\("{tag}[^0-9]'      stub_glob = "*.rs"
#   failed_test = '^---- (\S+) stdout ----'
#   detail = '^error(\[|:)|panicked at'
# Python with pytest (not yet run in a frame; check the regexes first):
#   lint = "ruff check -q ."
#   format = "ruff format --check -q ."      format_fix = "Not formatted. Run: ruff format ."
#   stub = 'NotImplementedError\("{tag}[^0-9]'      stub_glob = "*.py"
#   failed_test = '^FAILED \S+::(\S+)'
#   detail = '^E  |^ERROR'

[[milestone]]
id = "M0"
what = "The frame"
needs = []
tier = "T1"
test = ["<command that runs only the frame's own suite>"]
status = "done"

[[milestone]]
id = "M1"
what = "<first milestone: small, tight oracle>"
needs = ["M0"]
tier = "T3"
effort = "medium"
test = ["<command that runs only this milestone's suite>"]
status = ""

[[milestone]]
id = "A"
kind = "checkpoint"
what = "Checkpoint A: did the frame hold up?"
needs = ["M1"]
tier = "T1"
status = ""

# Everything after the first checkpoint needs "A" at least: the frame is
# not known to be fillable before it.
#
# A milestone with no `test` is checked by hand; say how in a comment and in
# the milestone doc. Sub-milestones that share stubs (M5a, M5b) set
# stub_tag = "M5", and then need one another in sequence: the stub gate of
# each fails while the other's stubs are left. A sub-milestone with no stubs
# of its own (a data file) leaves stub_tag out.
